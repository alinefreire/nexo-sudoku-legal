    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;

      color: var(--text);

      padding: 2rem 1.25rem 4rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;

      letter-spacing: -0.02em;
    }

      list-style: none;
      padding: 0;
      margin: 2rem 0 0;
    }
    li { margin: 0.75rem 0; }
